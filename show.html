    <style>
      /* Globale Box-Korrektur (Verhindert, dass das Grid zu breit wird) */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      main section {
        margin-top: 0px;
        width: 100%;
        min-height: 100vh;
        height: 100%;
      }

      h1 {
        text-align: center;
        width: 100%;
      }

      /* Grid exakt wie bei den Serien */
      #moviesGrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        padding: 20px 20px;
      }

      .movie-card {
        background: #111;
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        text-align: center;
        color: white;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        backface-visibility: hidden;
        padding-bottom: 15px; /* Platz für Meta-Infos unten */
      }

      .movie-card:hover {
        transform: scale(1.05);
        box-shadow: 0px 0px 20px 2px red;
      }

      .movie-card img {
        width: 100%;
        height: 150px; /* Vorher 220px -> Jetzt kleiner */
        object-fit: cover;
        display: block;
      }

      .movie-card h3 {
        margin: 10px 0 5px 0;
        padding: 0 10px;
      }

      .movie-meta {
        color: #aaa;
        font-size: 13px;
        margin: 0;
        padding: 0 10px;
      }

      /* MODAL FÜR FILME */
      #movieModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        justify-content: center;
        align-items: center;
        padding: 20px;
        z-index: 9999;
      }

      #movieModal.open {
        display: flex;
      }

      .modal-content {
        background: #88000056;
        padding: 40px 20px 20px 20px;
        border-radius: 10px;
        width: 90%;
        max-width: 900px;
        color: white;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        cursor: pointer;
        font-size: 26px;
        color: white;
        z-index: 10000;
        transition: color 0.2s;
      }

      .close-btn:hover {
        color: red;
      }
    </style>
