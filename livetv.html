    <style>
      /* Globale Box-Korrektur */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      main section {
        margin-top: 0px;
        width: 100%;
        min-height: 100vh;
        height: 100%;
      }

      h1 {
        text-align: center;
        width: 100%;
        color: white;
        font-family: "Poppins", sans-serif;
      }

      .info-text {
        text-align: center;
        color: white;
        font-family: "Poppins", sans-serif;
        margin-bottom: 20px;
      }

      /* TV Grid-Layout passend zum Serien-Grid */
      #tvGrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        padding: 20px;
      }

      /* Styling für die TV-Cards */
      .tv-card {
        height: 12em;
        background: linear-gradient(135deg, #222 0%, #111 100%);
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        backface-visibility: hidden;
        border: 2px solid transparent;
        font-family: "Poppins", sans-serif;
        gap: 10px;
        padding: 20px;
      }

      .tv-card:hover {
        transform: scale(1.05);
        box-shadow: 0px 0px 20px 2px red;
        border-color: red;
      }

      .tv-icon {
        font-size: 3rem;
        color: #888;
        transition: color 0.2s;
      }

      .tv-card:hover .tv-icon {
        color: red;
      }

      /* MODAL (Identisch mit deinem Serien-Modal) */
      #tvModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        justify-content: center;
        align-items: center;
        padding: 20px;
        z-index: 9999;
      }

      #tvModal.open {
        display: flex;
      }

      .modal-content {
        background: #88000056;
        padding: 40px 20px 20px 20px;
        border-radius: 10px;
        width: 90%;
        max-width: 900px;
        color: white;
        max-height: 90vh;
        overflow: hidden; /* ÄNDERUNG: Verhindert Scrollbalken im Container */
        position: relative;
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        cursor: pointer;
        font-size: 26px;
        color: white;
        z-index: 10000;
        transition: color 0.2s;
      }

      .close-btn:hover {
        color: red;
      }

      #videoFrame {
        border-radius: 5px;
        background: #000;
        width: 100%; /* NEU: Zwingt das Video auf die volle Breite */
        height: auto; /* NEU: Entfernt die starre Höhenvorgabe */
        aspect-ratio: 16 / 9; /* NEU: Erzwingt das perfekte TV-Format */
        display: block; /* NEU: Verhindert kleine Abstände unter dem Video */
      }
    </style>

    <!-- TV PLAYER MODAL OVERLAY -->

    <!-- JavaScript für Modal-Steuerung & Live-Suche -->
    <script>
      // Funktion zum Öffnen des Modals und Laden des Streams
      function openTvModal(title, streamUrl) {
        document.getElementById("streamTitle").innerText = title;
        document.getElementById("videoFrame").src = streamUrl;
        document.getElementById("tvModal").classList.add("open");
      }

      // Funktion zum Schließen und Stoppen des Streams
      function closeTvModal() {
        document.getElementById("tvModal").classList.remove("open");
        document.getElementById("videoFrame").src = ""; // Stoppt das Video im Hintergrund
      }

      // Schließen, wenn man außerhalb des Modals klickt
      window.onclick = function (event) {
        const modal = document.getElementById("tvModal");
        if (event.target == modal) {
          closeTvModal();
        }
      };

      // Live-Suchfunktion für die TV-Sender
      document
        .getElementById("searchInput")
        .addEventListener("input", function (e) {
          const searchTerm = e.target.value.toLowerCase().trim();
          const cards = document.querySelectorAll(".tv-card");

          cards.forEach((card) => {
            const titleText = card.querySelector("h3").innerText.toLowerCase();
            if (titleText.includes(searchTerm)) {
              card.style.display = "flex"; // Zeigen, wenn Treffer
            } else {
              card.style.display = "none"; // Verstecken, wenn kein Treffer
            }
          });
        });
    </script>
