    <title>Filma</title>

    <style>
      /* Globale Box-Korrektur (Verhindert, dass das Grid zu breit wird) */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      main section {
        margin-top: 0px;
        width: 100%;
        min-height: 100vh;
        height: 100%;
      }

      h1 {
        text-align: center;
        width: 100%;
      }

      /* Grid exakt wie bei den Serien */
      #moviesGrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        padding: 20px 20px;
      }

      .movie-card {
        background: #111;
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        text-align: center;
        color: white;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        backface-visibility: hidden;
        padding-bottom: 15px; /* Platz für Meta-Infos unten */
      }

      .movie-card:hover {
        transform: scale(1.05);
        box-shadow: 0px 0px 20px 2px red;
      }

      .movie-card img {
        width: 100%;
        height: 150px; /* Vorher 220px -> Jetzt kleiner */
        object-fit: cover;
        display: block;
      }

      .movie-card h3 {
        margin: 10px 0 5px 0;
        padding: 0 10px;
      }

      .movie-meta {
        color: #aaa;
        font-size: 13px;
        margin: 0;
        padding: 0 10px;
      }

      /* MODAL FÜR FILME */
      #movieModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        justify-content: center;
        align-items: center;
        padding: 20px;
        z-index: 9999;
      }

      #movieModal.open {
        display: flex;
      }

      .modal-content {
        background: #88000056;
        padding: 40px 20px 20px 20px;
        border-radius: 10px;
        width: 90%;
        max-width: 900px;
        color: white;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        cursor: pointer;
        font-size: 26px;
        color: white;
        z-index: 10000;
        transition: color 0.2s;
      }

      .close-btn:hover {
        color: red;
      }
    </style>
  </head>

    <main>
      <h1>Filma</h1>

    <!-- MODAL FÜR DIE VIDEO-WIEDERGABE -->

    <!-- LOGIK FÜR FILME -->
    <script>
      let moviesList = [];

      // 1. Daten aus der filma.json laden
      fetch("filma.json")
        .then((res) => {
          if (!res.ok) {
            throw new Error(
              `Datei filma.json nicht gefunden (Status: ${res.status}). Pfad oder Dateiname prüfen!`,
            );
          }
          return res.json();
        })
        .then((data) => {
          moviesList = data;
          renderGrid(moviesList);
        })
        .catch((err) => {
          console.error("Fehler beim Laden:", err);
          alert(
            "⚠️ Ladefehler:\n" +
              err.message +
              "\n\nTipp: Wenn du die Datei per Doppelklick öffnest, blockiert der Browser oft das Laden. Nutze einen Live-Server (z.B. in VS Code).",
          );
        });

      // 2. Funktion zum Rendern des Film-Grids
      function renderGrid(moviesToRender) {
        const grid = document.getElementById("moviesGrid");
        if (!grid) {
          console.error(
            "Fehler: Element mit der ID 'moviesGrid' wurde im HTML nicht gefunden!",
          );
          return;
        }
        grid.innerHTML = "";

        moviesToRender.forEach((movie) => {
          const card = document.createElement("div");
          card.classList.add("movie-card");

          card.innerHTML = `
      <img src="${movie.image}" alt="${movie.title}">
      <h3>${movie.title}</h3>
      <p class="movie-meta">${movie.genre} • ${movie.year}</p>
    `;

          card.onclick = () => openMovieModal(movie);
          grid.appendChild(card);
        });
      }

      // 3. Live-Suchfunktion (Filtert nach Filmtitel ODER Genre)
      const searchInput = document.getElementById("searchInput");
      if (searchInput) {
        searchInput.addEventListener("input", function (e) {
          const searchTerm = e.target.value.toLowerCase().trim();

          const filteredMovies = moviesList.filter(
            (movie) =>
              movie.title.toLowerCase().includes(searchTerm) ||
              movie.genre.toLowerCase().includes(searchTerm),
          );

          renderGrid(filteredMovies);
        });
      }

      // 4. Modal für Film öffnen und direkt abspielen
function openMovieModal(movie) {
  const modal = document.getElementById("movieModal");
  if (!modal) {
    alert("Fehler: Element mit ID 'movieModal' fehlt im HTML!");
    return;
  }

  // Sicherstellen, dass das Titelelement existiert (Fehlerschutz)
  const titleElement =
    document.getElementById("movieTitle") ||
    document.getElementById("episodeTitle");
  if (titleElement) {
    titleElement.textContent = `${movie.title} (${movie.year}) – ${movie.genre}`;
  }

  // Video-Frame suchen und befüllen (KORRIGIERT: movie.youtube, Backticks & Autoplay-Parameter)
  const videoFrame = document.getElementById("videoFrame");
  if (videoFrame) {
    // allow-Attribut dynamisch für Autoplay absichern
    videoFrame.setAttribute("allow", "autoplay; fullscreen");
    videoFrame.src = `https://www.youtube.com/embed/${movie.youtube}?autoplay=1`;
  }

  modal.classList.add("open");
}


      // 5. Modal schließen und Player stoppen
      function closeModal() {
        const modal = document.getElementById("movieModal");
        const videoFrame = document.getElementById("videoFrame");

        if (videoFrame) videoFrame.src = "";
        if (modal) modal.classList.remove("open");
      }
    </script>
  </body>
